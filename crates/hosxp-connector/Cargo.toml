[package]
name = "er-refill-hosxp-connector"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The only crate allowed to talk to HOSxP MySQL for ER-Refill - SELECT-only pool, encrypted settings, read-only guard"

[features]
# Live-DB tests, never run against production (AGENTS.md section 13).
integration-tests = []

[dependencies]
async-trait.workspace = true       # #[async_trait] on the HosxRepository impl
chrono.workspace = true            # window bounds as NaiveDate/NaiveTime
encryptman.workspace = true        # AES-256-GCM for connection settings at rest
encryptman-keyring.workspace = true # OS-keychain storage of the master key
secrecy.workspace = true           # SecretString: password zeroized on drop
serde.workspace = true             # config file layout
serde_json.workspace = true        # config file on disk
sqlx.workspace = true              # SELECT-only MySQL access
thiserror.workspace = true         # structured errors in library crates
tokio.workspace = true             # async file I/O for the config file
er-refill-core = { path = "../core" }
er-refill-models = { path = "../models" }

[dev-dependencies]
tempfile.workspace = true          # test-only config files
