<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer Icon Shape & Clip -->
    <clipPath id="icon-clip">
      <rect width="512" height="512" rx="136" />
    </clipPath>

    <!-- 3D Convex Gradients for Bear -->
    <linearGradient id="bearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- 3D Emboss & Depth Filters -->
    <filter id="emboss-3d" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="-3" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Frame with Solid Background (no shadow) -->
  <rect width="512" height="512" rx="136" fill="#FCE7F3" />

  <!-- Inner Content (Clipped) -->
  <g clip-path="url(#icon-clip)">
    <!-- Bear Ears (Placed behind the head) -->
    <g fill="url(#bearGrad)" filter="url(#emboss-3d)">
      <circle cx="124" cy="140" r="86" />
      <circle cx="388" cy="140" r="86" />
    </g>
    <circle cx="124" cy="140" r="43" fill="#FEF08A" />
    <circle cx="388" cy="140" r="43" fill="#FEF08A" />

    <!-- Bear Head -->
    <circle cx="256" cy="256" r="176" fill="url(#bearGrad)" filter="url(#emboss-3d)" />

    <!-- Nurse Cap -->
    <g filter="url(#emboss-3d)">
      <path d="M 164 116 Q 256 72 348 116 L 326 28 Q 256 10 186 28 Z" fill="#FFFFFF" />
      <rect x="228" y="40" width="56" height="84" rx="14" fill="#F43F5E" />
      <rect x="204" y="60" width="104" height="42" rx="14" fill="#F43F5E" />
    </g>

    <!-- Face / Muzzle -->
    <ellipse cx="256" cy="290" rx="72" ry="52" fill="#FEF3C7" />
    <ellipse cx="256" cy="274" rx="32" ry="22" fill="#451A03" />
    <path d="M 226 308 Q 256 338 286 308" stroke="#451A03" stroke-width="16" fill="none" stroke-linecap="round" />

    <!-- Eyes -->
    <circle cx="172" cy="212" r="21" fill="#451A03" />
    <circle cx="340" cy="212" r="21" fill="#451A03" />

    <!-- Hugging Paws -->
    <circle cx="136" cy="402" r="66" fill="url(#bearGrad)" filter="url(#emboss-3d)" />
    <circle cx="376" cy="402" r="66" fill="url(#bearGrad)" filter="url(#emboss-3d)" />

    <!-- Mini Heart in Center with Medical Cross (White Heart & Pink Cross) -->
    <g filter="url(#emboss-3d)">
      <path d="M 256 470 C 140 380, 150 312, 202 312 C 226 312, 256 348, 256 348 C 256 348, 286 312, 310 312 C 362 312, 372 380, 256 470 Z" fill="#FFFFFF" />
    </g>
    <path d="M 256 366 V 426 M 222 396 H 290" stroke="#F43F5E" stroke-width="22" stroke-linecap="round" />
  </g>
</svg>
