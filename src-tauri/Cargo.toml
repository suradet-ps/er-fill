[package]
name = "er-refill-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tauri 2 shell for ER-Refill - thin command adapters only, no business logic, no SQL"

[lib]
name = "er_refill_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
chrono.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
er-refill-core = { path = "../crates/core" }
er-refill-hosxp-connector = { path = "../crates/hosxp-connector" }
er-refill-models = { path = "../crates/models" }

[dev-dependencies]
tempfile.workspace = true
