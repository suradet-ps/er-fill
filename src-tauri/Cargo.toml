[package]
name = "er-fill-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tauri 2 shell for ER-Fill - thin command adapters only, no business logic, no SQL"

[lib]
name = "er_fill_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
chrono.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
er-fill-core = { path = "../crates/core" }
er-fill-hosxp-connector = { path = "../crates/hosxp-connector" }
er-fill-models = { path = "../crates/models" }

[dev-dependencies]
tempfile.workspace = true
