# cargo-deny configuration for ER-Refill
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []

[output]
feature-depth = 1

[advisories]
ignore = [
  # Marvin Attack timing sidechannel on rsa (transitive dep of sqlx-mysql
  # for caching_sha2_password auth). The hospital HOSxP instance has TLS
  # disabled, so the connector uses opportunistic TLS on the hospital LAN
  # with a SELECT-only account; the advisory itself says local use on a
  # non-compromised computer is fine. No patched release exists.
  { id = "RUSTSEC-2023-0071", reason = "sqlx-mysql RSA auth exchange; HOSxP has TLS disabled, LAN-only deployment with a read-only account" },
  # proc-macro-error unmaintained (transitive dep of glib/gtk)
  "RUSTSEC-2024-0370",
  # zbus_names/zvariant/zvariant_derive were merged into zbus 6.0.0 and are
  # no longer maintained standalone, but zbus 5.x is still pulled in by
  # secret-service 5.x (keyring's Linux Secret Service backend, via
  # encryptman-keyring). No released secret-service or keyring version has
  # migrated to zbus 6 yet, so there is no upgrade path; all three are
  # reachable only on Linux.
  { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; secret-service 5.x still on zbus 5, no upgrade path yet; Linux-only keyring backend" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; secret-service 5.x still on zbus 5, no upgrade path yet; Linux-only keyring backend" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; secret-service 5.x still on zbus 5, no upgrade path yet; Linux-only keyring backend" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "LGPL-2.1-or-later",
  "MPL-2.0",
]
confidence-threshold = 0.92

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
